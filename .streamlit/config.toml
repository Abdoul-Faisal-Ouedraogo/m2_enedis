[server]
# Pas d'adresse ici : Streamlit Cloud doit pouvoir écouter. En local, la commande
# du README passe --server.address 127.0.0.1 ; Docker passe 0.0.0.0.
port = 8501
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0e7490"
backgroundColor = "#f4f7fb"
secondaryBackgroundColor = "#e8eef6"
textColor = "#172b4d"
font = "sans serif"
baseFontSize = 18
